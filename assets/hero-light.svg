<svg xmlns="http://www.w3.org/2000/svg" width="900" height="290" viewBox="0 0 900 290" role="img" aria-label="Anand Singh - Backend and Web3 Engineer">
  <defs>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0052FF"/>
      <stop offset="1" stop-color="#0E8A6D"/>
    </linearGradient>
    <clipPath id="typeclip">
      <rect x="40" y="52" width="0" height="26">
        <animate attributeName="width" values="0;24;47;71;94;118;141;165;188;212;235" calcMode="discrete" dur="1.6s" begin="0.4s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>

  <rect x="1" y="1" width="898" height="288" rx="14" fill="#FFFFFF" stroke="#D0D7DE"/>
  <path d="M15 1 H885 A14 14 0 0 1 899 15 V36 H1 V15 A14 14 0 0 1 15 1 Z" fill="#EAEEF2"/>
  <line x1="1" y1="36" x2="899" y2="36" stroke="#D0D7DE"/>
  <circle cx="24" cy="19" r="6" fill="#FF5F56"/>
  <circle cx="46" cy="19" r="6" fill="#FFBD2E"/>
  <circle cx="68" cy="19" r="6" fill="#27C93F"/>
  <text x="450" y="23" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#57606A">anand@base: ~/profile</text>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace">
    <text x="22" y="70" font-size="14" fill="#1A7F37">$</text>
    <g clip-path="url(#typeclip)">
      <text x="40" y="70" font-size="14" fill="#1F2328">ssh anand@base --chain 8453</text>
    </g>
    <rect x="40" y="56" width="8" height="17" fill="#0E8A6D">
      <animate attributeName="x" values="40;64;87;111;134;158;181;205;228;252;275" calcMode="discrete" dur="1.6s" begin="0.4s" fill="freeze"/>
      <animate attributeName="opacity" values="1;0" calcMode="discrete" dur="1.1s" begin="2.2s" repeatCount="indefinite"/>
    </rect>

    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.35s" begin="2.2s" fill="freeze"/>
      <circle cx="27" cy="94" r="4" fill="#1A7F37"/>
      <text x="40" y="99" font-size="13" fill="#57606A">connected &#183; payment rails online</text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.5s" begin="2.7s" fill="freeze"/>
      <text x="38" y="152" font-size="44" font-weight="bold" letter-spacing="2" fill="url(#acc)">ANAND SINGH</text>
    </g>
    <rect x="40" y="164" width="0" height="4" rx="2" fill="url(#acc)">
      <animate attributeName="width" values="0;330" dur="0.5s" begin="3.0s" fill="freeze"/>
    </rect>

    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="3.3s" fill="freeze"/>
      <text x="40" y="196" font-size="14.5" fill="#57606A">Backend &amp; Web3 Engineer &#8212; distributed systems, smart contracts, payments infra</text>
    </g>

    <g opacity="0" font-size="13">
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="3.6s" fill="freeze"/>
      <text x="40" y="224" fill="#1F2328"><tspan fill="#3178C6">&#9679;</tspan> TypeScript   <tspan fill="#AA6746">&#9679;</tspan> Solidity   <tspan fill="#DEA584">&#9679;</tspan> Rust   <tspan fill="#5FA04E">&#9679;</tspan> Node.js   <tspan fill="#0052FF">&#9679;</tspan> Postgres &#183; Redis</text>
    </g>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.6s" begin="3.9s" fill="freeze"/>
    <line x1="60" y1="252" x2="840" y2="252" stroke="#EAEEF2" stroke-width="3"/>
    <line x1="60" y1="252" x2="840" y2="252" stroke="#D0D7DE" stroke-width="1"/>
    <circle cx="70" cy="252" r="4.5" fill="#FFFFFF" stroke="#0052FF" stroke-width="2"/>
    <text x="70" y="274" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#57606A">UPI</text>
    <circle cx="330" cy="252" r="4.5" fill="#FFFFFF" stroke="#0052FF" stroke-width="2"/>
    <text x="330" y="274" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#57606A">P2P.me</text>
    <circle cx="590" cy="252" r="4.5" fill="#FFFFFF" stroke="#0052FF" stroke-width="2"/>
    <text x="590" y="274" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#57606A">USDC</text>
    <circle cx="830" cy="252" r="4.5" fill="#FFFFFF" stroke="#0052FF" stroke-width="2"/>
    <text x="830" y="274" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#57606A">BASE 8453</text>
    <circle r="5.5" fill="#0E8A6D">
      <animateMotion path="M60,252 H840" dur="4.5s" begin="4.2s" repeatCount="indefinite"/>
    </circle>
    <circle r="10" fill="#0E8A6D" opacity="0.25">
      <animateMotion path="M60,252 H840" dur="4.5s" begin="4.2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>