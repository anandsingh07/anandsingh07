<svg xmlns="http://www.w3.org/2000/svg" width="440" height="150" viewBox="0 0 440 150" role="img" aria-label="Z-Short - project card">
  <defs>
    <linearGradient id="ab-zshort" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0052FF"/>
      <stop offset="1" stop-color="#0E8A6D"/>
    </linearGradient>
    <clipPath id="cc-zshort">
      <rect x="0.5" y="0.5" width="439" height="149" rx="10"/>
    </clipPath>
  </defs>

  <rect x="0.5" y="0.5" width="439" height="149" rx="10" fill="#FFFFFF" stroke="#D0D7DE"/>

  <g clip-path="url(#cc-zshort)">
    <rect x="0.5" y="0.5" width="3" height="149" fill="url(#ab-zshort)"/>
  </g>

  <!-- status dot: pulse + ping ring -->
  <circle cx="27" cy="26" r="5" fill="none" stroke="#F778BA" stroke-width="1.5" opacity="0">
    <animate attributeName="r" values="5;11" dur="2.6s" begin="1.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0" dur="2.6s" begin="1.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="27" cy="26" r="5.25" fill="#F778BA">
    <animate attributeName="r" values="4.5;6;4.5" dur="2.6s" begin="1.6s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
  </circle>

  <text x="44" y="31" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" font-weight="bold" fill="#1F2328">Z-Short</text>
  <text x="422" y="30" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" fill="#57606A">&#8599;</text>
  <text x="44" y="47" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#57606A">anandsingh07/URL-Shortner</text>

  <text x="22" y="72" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#57606A">High-performance URL shortener - Postgres for</text>
  <text x="22" y="89" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#57606A">persistence, Redis cache for sub-ms redirects.</text>

  <g>
    <rect x="20" y="108" width="79" height="24" rx="12" fill="#F6F8FA" stroke="#D0D7DE"/>
    <circle cx="33" cy="120" r="3.5" fill="#9CA3AF"/>
    <text x="42" y="124" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#57606A">Next.js</text>
  </g>
  <g>
    <rect x="107" y="108" width="79" height="24" rx="12" fill="#F6F8FA" stroke="#D0D7DE"/>
    <circle cx="120" cy="120" r="3.5" fill="#5FA04E"/>
    <text x="129" y="124" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#57606A">Express</text>
  </g>
  <g>
    <rect x="194" y="108" width="65" height="24" rx="12" fill="#F6F8FA" stroke="#D0D7DE"/>
    <circle cx="207" cy="120" r="3.5" fill="#DC382D"/>
    <text x="216" y="124" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#57606A">Redis</text>
  </g>
</svg>