<svg xmlns="http://www.w3.org/2000/svg" width="440" height="150" viewBox="0 0 440 150" role="img" aria-label="SemanticCache - project card">
  <defs>
    <linearGradient id="ab-semanticcache" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4D8DFF"/>
      <stop offset="1" stop-color="#00D395"/>
    </linearGradient>
    <clipPath id="cc-semanticcache">
      <rect x="0.5" y="0.5" width="439" height="149" rx="10"/>
    </clipPath>
  </defs>

  <rect x="0.5" y="0.5" width="439" height="149" rx="10" fill="#10151D" stroke="#30363D"/>

  <g clip-path="url(#cc-semanticcache)">
    <rect x="0.5" y="0.5" width="3" height="149" fill="url(#ab-semanticcache)"/>
  </g>

  <g clip-path="url(#cc-semanticcache)">
    <g transform="translate(-220 0)">
      <animateTransform attributeName="transform" type="translate" values="-220 0;560 0" dur="6s" begin="0.0s" repeatCount="indefinite"/>
      <polygon points="90,0 152,0 62,150 0,150" fill="#FFFFFF" opacity="0.035"/>
    </g>
  </g>
  <!-- status dot: pulse + ping ring -->
  <circle cx="27" cy="26" r="5" fill="none" stroke="#4D8DFF" stroke-width="1.5" opacity="0">
    <animate attributeName="r" values="5;11" dur="2.6s" begin="0.0s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0" dur="2.6s" begin="0.0s" repeatCount="indefinite"/>
  </circle>
  <circle cx="27" cy="26" r="5.25" fill="#4D8DFF">
    <animate attributeName="r" values="4.5;6;4.5" dur="2.6s" begin="0.0s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
  </circle>

  <text x="44" y="31" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" font-weight="bold" fill="#E6EDF3">SemanticCache</text>
  <text x="422" y="30" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" fill="#8B949E">&#8599;</text>
  <text x="44" y="47" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#8B949E">anandsingh07/semanticcache</text>

  <text x="22" y="72" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#8B949E">Semantic caching proxy for LLM APIs - Redis exact hits</text>
  <text x="22" y="89" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#8B949E">in ~7ms, pgvector ANN for near-duplicate prompts.</text>

  <g>
    <rect x="20" y="108" width="99" height="24" rx="12" fill="#161B22" stroke="#30363D"/>
    <circle cx="33" cy="120" r="3.5" fill="#3178C6"/>
    <text x="42" y="124" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#8B949E">TypeScript</text>
  </g>
  <g>
    <rect x="127" y="108" width="65" height="24" rx="12" fill="#161B22" stroke="#30363D"/>
    <circle cx="140" cy="120" r="3.5" fill="#DC382D"/>
    <text x="149" y="124" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#8B949E">Redis</text>
  </g>
  <g>
    <rect x="200" y="108" width="85" height="24" rx="12" fill="#161B22" stroke="#30363D"/>
    <circle cx="213" cy="120" r="3.5" fill="#336791"/>
    <text x="222" y="124" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#8B949E">pgvector</text>
  </g>
</svg>